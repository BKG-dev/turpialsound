<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="none">
  <defs>
    <!-- Dome clip: region BELOW the arch → opaque; above → transparent -->
    <clipPath id="c">
      <path d="M0,700 H1600 V230 C1200,230 1050,-10 800,-10 C550,-10 400,230 0,230 Z"/>
    </clipPath>
    <filter id="b1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="b2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <g clip-path="url(#c)">
    <!-- Dark base -->
    <rect width="1600" height="700" fill="#0a0a0a"/>

    <!-- Cyan glow — center of the dome peak -->
    <ellipse cx="800" cy="40"  rx="620" ry="220" fill="#00aeef" opacity="0.52" filter="url(#b1)"/>
    <ellipse cx="800" cy="90"  rx="340" ry="140" fill="#29bcff" opacity="0.38" filter="url(#b2)"/>

    <!-- Deep cyan arc along the dome edge -->
    <ellipse cx="800" cy="0"   rx="820" ry="90"  fill="#0050c8" opacity="0.48" filter="url(#b1)"/>

    <!-- Gold glow — left arch foot -->
    <ellipse cx="60"   cy="232" rx="290" ry="130" fill="#ffc107" opacity="0.52" filter="url(#b1)"/>
    <ellipse cx="100"  cy="250" rx="150" ry="72"  fill="#ffd54f" opacity="0.34" filter="url(#b2)"/>

    <!-- Gold glow — right arch foot -->
    <ellipse cx="1540" cy="232" rx="290" ry="130" fill="#ffc107" opacity="0.52" filter="url(#b1)"/>
    <ellipse cx="1500" cy="250" rx="150" ry="72"  fill="#ffd54f" opacity="0.34" filter="url(#b2)"/>
  </g>
</svg>
