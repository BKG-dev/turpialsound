name: Booking Custom Bundle Continuous Schedule

on:
  push:
    branches:
      - codex/preview-arma-tu-paquete-2026-06-19
    paths:
      - .github/workflows/booking-custom-bundle-continuous-schedule.yml
      - lib/bookings/caracas-time.ts
      - lib/bookings/custom-bundle-schedule.ts
      - lib/bookings/custom-bundle.ts
      - lib/bookings/custom-bundle-repricing.ts
      - lib/bookings/custom-bundle-submission.ts
      - scripts/qa/bookings/custom-bundle-continuous-schedule.ts
      - docs/orchestration/AVAILABILITY_GATE.json
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pnpm 10.18.1
        run: |
          corepack enable
          corepack prepare pnpm@10.18.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run custom bundle contract gate
        run: pnpm exec tsx scripts/qa/bookings/custom-bundle-contract.ts

      - name: Run custom bundle submission gate
        run: pnpm exec tsx scripts/qa/bookings/custom-bundle-submission-contract.ts

      - name: Run custom bundle repricing gate
        run: pnpm exec tsx scripts/qa/bookings/custom-bundle-authoritative-repricing.ts

      - name: Run custom bundle continuous schedule gate
        run: pnpm exec tsx scripts/qa/bookings/custom-bundle-continuous-schedule.ts

      - name: Run lint
        run: pnpm lint

      - name: Run TypeScript
        run: pnpm exec tsc --noEmit

      - name: Confirm no repository changes
        run: git diff --exit-code
