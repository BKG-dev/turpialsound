name: Booking Isolated Custom Bundle Persistence

on:
  push:
    branches:
      - codex/preview-arma-tu-paquete-2026-06-19
    paths:
      - .github/workflows/booking-isolated-custom-bundle-persistence.yml
      - lib/bookings/custom-bundle-persistence.ts
      - lib/bookings/custom-bundle-repricing.ts
      - lib/bookings/custom-bundle-submission.ts
      - lib/bookings/custom-bundle.ts
      - scripts/qa/bookings/custom-bundle-persistence-contract.ts
      - scripts/qa/bookings/isolated-custom-bundle-persistence-gate.ts
      - prisma/proposed/**
      - prisma/schema.prisma
      - prisma.config.ts
      - package.json
      - pnpm-lock.yaml
      - docs/orchestration/PERSISTENCE_GATE.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: booking-isolated-custom-bundle-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: turpial_ci
          POSTGRES_PASSWORD: turpial_ci_only
          POSTGRES_DB: turpial_booking_ci
        options: >-
          --health-cmd "pg_isready -U turpial_ci -d turpial_booking_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      TURPIAL_ALLOW_ISOLATED_DB_TESTS: 'true'
      TURPIAL_ISOLATED_DATABASE_URL: postgresql://turpial_ci:turpial_ci_only@127.0.0.1:5432/turpial_booking_ci
      DIRECT_URL: postgresql://turpial_ci:turpial_ci_only@127.0.0.1:5432/turpial_booking_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pnpm 10.18.1
        run: |
          corepack enable
          corepack prepare pnpm@10.18.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate baseline SQL
        run: |
          pnpm exec prisma migrate diff --config prisma.config.ts --from-empty --to-schema prisma/schema.prisma --script | sed -n '/^-- CreateSchema/,$p' > /tmp/turpial-current-baseline.sql

      - name: Persistence contract gate
        run: pnpm exec tsx scripts/qa/bookings/custom-bundle-persistence-contract.ts

      - name: Isolated persistence gate
        run: pnpm exec tsx scripts/qa/bookings/isolated-custom-bundle-persistence-gate.ts /tmp/turpial-current-baseline.sql prisma/proposed/20260622_bkg04_snapshot_booking_items.sql

      - name: Confirm no repository changes
        run: git diff --exit-code
